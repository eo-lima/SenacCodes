<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles/output.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <title>Cadastrar paciente | Saúde Fácil</title>
</head>
<body class="font-sans bg-blue-50">
    <header class="bg-blue-800">
        <div class="w-full h-[80px] flex justify-baseline px-5 items-center gap-3">
            <i class="fa-solid fa-hospital text-white text-2xl"></i>
            <h1 class="text-3xl text-white font-bold">Saúde Fácil</h1>
        </div>
    </header>
    <main class="mx-auto w-full max-w-[640px] px-4 pt-8 pb-10 sm:px-6 md:px-8">
        <section class="mt-5 sm:mt-6" aria-labelledby="titulo-cadastro">
            <div class="mx-auto mt-4 w-full max-w-[420px] md:max-w-[540px] lg:max-w-[640px]">
                <button type="button" class="inline-flex items-center gap-2 rounded-lg bg-blue-800 px-4 py-2 text-sm text-white duration-200 cursor-pointer hover:bg-blue-900 hover:scale-105 active:scale-100 active:bg-blue-800">
                    <i class="fa fa-arrow-left" aria-hidden="true"></i>
                    Voltar
                </button>
            </div>
            <h2 id="titulo-cadastro" class="mt-20 text-center text-2xl font-bold text-blue-900 sm:text-3xl">Cadastrar paciente</h2>
            <form class="mx-auto mt-8 w-full max-w-[420px] rounded-lg border border-blue-400 bg-white p-4 sm:p-5 md:max-w-[540px] md:p-7 lg:max-w-[640px] lg:p-8">
                <div class="flex flex-col gap-3">
                    <div class="flex flex-col gap-1">
                        <label for="nome" class="text-sm font-medium text-slate-900">Nome completo</label>
                        <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Ex: Maria da Silva" class="w-full rounded-lg border border-blue-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 sm:text-base">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="cpf" class="text-sm font-medium text-slate-900">CPF (somente números)</label>
                        <input id="cpf" name="cpf" type="text" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" class="w-full rounded-lg border border-blue-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 sm:text-base">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="nascimento" class="text-sm font-medium text-slate-900">Data de nascimento</label>
                        <input id="nascimento" name="nascimento" type="text" inputmode="numeric" placeholder="DD/MM/AAAA" class="w-full rounded-lg border border-blue-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 sm:text-base">
                    </div>
                    <button type="submit" class="mt-2 w-full rounded-xl bg-blue-800 px-4 py-3 font-semibold text-white duration-150 hover:bg-blue-900 hover:scale-[1.02] active:scale-100 active:bg-blue-800">
                        Cadastrar paciente
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
