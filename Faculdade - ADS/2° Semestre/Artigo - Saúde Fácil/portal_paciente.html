<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles/output.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
        theme: {
            extend: {
            fontFamily: {
                sans: ['Poppins', 'sans-serif'],
            },
            },
        },
        }
    </script>
    <title>Saúde Fácil</title>
</head>
<body class="font-sans bg-blue-50">
    <header class="bg-blue-800">
        <div class="w-full h-[80px] flex justify-baseline px-5 items-center gap-3">
            <i class="fa-solid fa-hospital text-white text-2xl"></i> 
            <h1 class="text-3xl text-white font-bold">Saúde Fácil</h1> 
        </div>
    </header>
    <main class="flex min-h-[calc(100vh-80px)] w-full items-center justify-center px-4 py-8 sm:px-6 md:px-8">
        <div class="w-full max-w-[620px] flex flex-col items-center -translate-y-6 lg:items-start">
            <button class="mb-8 bg-blue-800 w-[120px] px-5 py-2 text-white rounded-lg hover:bg-blue-900 duration-200 cursor-pointer hover:scale-105 active:scale-100 active:bg-blue-800"><i class="fa fa-arrow-left"></i> Voltar</button>
            <div class="w-full rounded-lg border-2 border-blue-800 bg-white p-5 sm:p-6 md:p-8 lg:p-10">
                <div class="flex flex-col items-center justify-center gap-4 text-center lg:gap-5">
                    <i class="fa fa-magnifying-glass text-blue-800 text-4xl sm:text-5xl lg:text-6xl"></i>
                    <h2 class="text-2xl font-semibold text-blue-800 sm:text-3xl lg:text-4xl">Portal do Paciente</h2>
                    <span class="text-sm text-slate-700 sm:text-base lg:text-lg">Digite seu CPF para consultar sua fila e acompanhar em tempo real</span>
                    <input type="text" placeholder="Digite aqui o CPF" class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 duration-150 sm:w-[90%] lg:w-[80%] lg:py-4 lg:text-lg">
                    <button class="w-full rounded-xl bg-blue-800 px-4 py-3 text-white hover:bg-blue-900 hover:scale-[1.02] duration-150 active:bg-blue-800 active:scale-100 sm:w-[90%] lg:w-[80%] lg:py-4 lg:text-lg">Consultar minha fila</button>
                    <span class="text-xs text-center text-slate-500 sm:text-sm lg:text-base">Seus dados são usados apenas para identificação</span>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
