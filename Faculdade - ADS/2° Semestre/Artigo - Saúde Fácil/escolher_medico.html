<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles/output.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <title>Escolha o médico | Saúde Fácil</title>
</head>
<body class="font-sans bg-blue-50">
    <header class="bg-blue-800">
        <div class="w-full h-[80px] flex justify-baseline px-5 items-center gap-3">
            <i class="fa-solid fa-hospital text-white text-2xl"></i>
            <h1 class="text-3xl text-white font-bold">Saúde Fácil</h1>
        </div>
    </header>
    <main class="mx-auto w-full max-w-[1200px] px-4 pt-8 pb-10 sm:px-6 md:px-8">
        <button type="button" class="inline-flex items-center gap-2 rounded-lg bg-blue-800 px-4 py-2 text-sm text-white duration-200 cursor-pointer hover:bg-blue-900 hover:scale-105 active:scale-100 active:bg-blue-800">
            <i class="fa fa-arrow-left" aria-hidden="true"></i>
            Voltar
        </button>

        <section class="mt-5 sm:mt-6" aria-labelledby="titulo-medicos">
            <h2 id="titulo-medicos" class="text-2xl font-bold text-blue-900 sm:text-3xl">Escolha o Médico</h2>
            <div class="mt-4 flex flex-col gap-4 rounded-xl border border-blue-400 bg-white p-4 sm:gap-5 sm:p-6 md:p-8">
                <button type="button" class="flex w-full items-center gap-4 rounded-lg border border-blue-300 px-4 py-3 text-left duration-150 hover:bg-blue-50 hover:shadow-sm active:scale-[0.99] sm:px-5">
                    <i class="fa-solid fa-user-doctor text-xl text-blue-800 sm:text-2xl" aria-hidden="true"></i>
                    <span class="flex flex-col">
                        <span class="font-semibold text-slate-900 sm:text-lg">Dr. Carlos Oliveira</span>
                        <span class="mt-1 flex items-center gap-2 text-xs text-slate-600 sm:text-sm">
                            Ver agenda <i class="fa-solid fa-arrow-right text-slate-900" aria-hidden="true"></i>
                        </span>
                    </span>
                </button>
                <button type="button" class="flex w-full items-center gap-4 rounded-lg border border-blue-300 px-4 py-3 text-left duration-150 hover:bg-blue-50 hover:shadow-sm active:scale-[0.99] sm:px-5">
                    <i class="fa-solid fa-user-doctor text-xl text-blue-800 sm:text-2xl" aria-hidden="true"></i>
                    <span class="flex flex-col">
                        <span class="font-semibold text-slate-900 sm:text-lg">Dr. Priscila Lima</span>
                        <span class="mt-1 flex items-center gap-2 text-xs text-slate-600 sm:text-sm">
                            Ver agenda <i class="fa-solid fa-arrow-right text-slate-900" aria-hidden="true"></i>
                        </span>
                    </span>
                </button>
            </div>
        </section>
    </main>
</body>
</html>
