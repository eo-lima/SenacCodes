<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles/output.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <title>Pacientes cadastrados | Saúde Fácil</title>
</head>
<body class="font-sans bg-blue-50">
    <header class="bg-blue-800">
        <div class="w-full h-[80px] flex justify-baseline px-5 items-center gap-3">
            <i class="fa-solid fa-hospital text-white text-2xl"></i>
            <h1 class="text-3xl text-white font-bold">Saúde Fácil</h1>
        </div>
    </header>
    <main class="mx-auto w-full max-w-[1200px] px-4 pt-8 pb-10 sm:px-6 md:px-8">
        <button type="button" class="inline-flex items-center gap-2 rounded-lg bg-blue-800 px-4 py-2 text-sm text-white duration-200 cursor-pointer hover:bg-blue-900 hover:scale-105 active:scale-100 active:bg-blue-800">
            <i class="fa fa-arrow-left" aria-hidden="true"></i>
            Voltar
        </button>

        <section class="mt-5 sm:mt-6" aria-labelledby="titulo-pacientes">
            <h2 id="titulo-pacientes" class="text-2xl font-bold text-blue-900 sm:text-3xl">Pacientes cadastrados</h2>
            <p class="mt-1 text-sm font-medium text-slate-600 sm:text-base">Clique em “Agendar” para marcar uma consulta</p>

            <div class="mt-6 rounded-2xl border border-blue-400 bg-white p-4 sm:p-6">
                <label for="busca-paciente" class="sr-only">Buscar pacientes por nome ou CPF</label>
                <input id="busca-paciente" name="busca-paciente" type="search" placeholder="Buscar por nome ou CPF..." class="w-full rounded-lg border border-blue-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 sm:text-base">

                <ul class="mt-3 overflow-hidden rounded-xl border border-blue-300">
                    <li class="flex flex-col gap-3 border-b border-blue-200 px-4 py-4 last:border-b-0 sm:flex-row sm:items-center sm:justify-between sm:px-6">
                        <div>
                            <h3 class="font-semibold text-slate-900">Maria Silva</h3>
                            <p class="mt-1 text-sm text-slate-700">123.456.789.01 <span class="px-1">·</span> 76 anos</p>
                        </div>
                        <button type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-blue-800 px-4 py-2.5 text-sm font-semibold text-white duration-150 hover:bg-blue-900 hover:scale-[1.02] active:scale-100 active:bg-blue-800 sm:w-auto">
                            <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
                            Agendar
                        </button>
                    </li>
                    <li class="flex flex-col gap-3 border-b border-blue-200 px-4 py-4 last:border-b-0 sm:flex-row sm:items-center sm:justify-between sm:px-6">
                        <div>
                            <h3 class="font-semibold text-slate-900">João Santos</h3>
                            <p class="mt-1 text-sm text-slate-700">987.654.321.00 <span class="px-1">·</span> 81 anos</p>
                        </div>
                        <button type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-blue-800 px-4 py-2.5 text-sm font-semibold text-white duration-150 hover:bg-blue-900 hover:scale-[1.02] active:scale-100 active:bg-blue-800 sm:w-auto">
                            <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
                            Agendar
                        </button>
                    </li>
                    <li class="flex flex-col gap-3 px-4 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6">
                        <div>
                            <h3 class="font-semibold text-slate-900">Ana Paula Costa</h3>
                            <p class="mt-1 text-sm text-slate-700">456.789.123-00 <span class="px-1">·</span> 36 anos</p>
                        </div>
                        <button type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-blue-800 px-4 py-2.5 text-sm font-semibold text-white duration-150 hover:bg-blue-900 hover:scale-[1.02] active:scale-100 active:bg-blue-800 sm:w-auto">
                            <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
                            Agendar
                        </button>
                    </li>
                </ul>
            </div>
        </section>
    </main>
</body>
</html>
