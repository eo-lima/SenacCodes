<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles/output.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <title>Recepção | Saúde Fácil</title>
</head>
<body class="font-sans bg-blue-50">
    <header class="bg-blue-800">
        <div class="w-full h-[80px] flex justify-baseline px-5 items-center gap-3">
            <i class="fa-solid fa-hospital text-white text-2xl"></i>
            <h1 class="text-3xl text-white font-bold">Saúde Fácil</h1>
        </div>
    </header>
    <main class="mx-auto flex min-h-[calc(100vh-80px)] w-full max-w-[1200px] flex-col justify-start px-4 pt-16 pb-8 sm:px-6 md:px-8">
        <a href="./tela_inicial.html" class="inline-flex self-start items-center gap-2 rounded-lg bg-blue-800 px-4 py-2 text-sm text-white duration-200 hover:bg-blue-900 active:bg-blue-800">
            <i class="fa fa-arrow-left" aria-hidden="true"></i>
            Voltar
        </a>
        <section class="mt-5 sm:mt-6" aria-labelledby="titulo-recepcao">
            <h2 id="titulo-recepcao" class="text-3xl font-bold text-blue-900 sm:text-4xl">Recepção</h2>
            <p class="mt-1 text-sm text-blue-700 sm:text-base">Gerencie pacientes e atendimentos</p>

            <div class="mt-7 grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5 md:grid-cols-3 md:gap-6 lg:gap-8">
                <button type="button" class="flex min-h-[140px] flex-col items-center justify-center gap-4 rounded-2xl border border-blue-400 bg-white px-5 py-6 text-center shadow-sm duration-200 hover:-translate-y-1 hover:shadow-md sm:min-h-[160px]">
                    <i class="fa-solid fa-plus text-2xl text-violet-500" aria-hidden="true"></i>
                    <span class="text-sm font-medium text-slate-900 sm:text-base">Cadastrar pacientes</span>
                </button>
                <button type="button" class="flex min-h-[140px] flex-col items-center justify-center gap-4 rounded-2xl border border-blue-400 bg-white px-5 py-6 text-center shadow-sm duration-200 hover:-translate-y-1 hover:shadow-md sm:min-h-[160px]">
                    <i class="fa-solid fa-user-doctor text-2xl text-blue-800" aria-hidden="true"></i>
                    <span class="text-sm font-medium text-slate-900 sm:text-base">Cadastrar médico</span>
                </button>
                <button type="button" class="flex min-h-[140px] flex-col items-center justify-center gap-4 rounded-2xl border border-blue-400 bg-white px-5 py-6 text-center shadow-sm duration-200 hover:-translate-y-1 hover:shadow-md sm:col-span-2 md:col-span-1">
                    <i class="fa-solid fa-clipboard-list text-2xl text-blue-800" aria-hidden="true"></i>
                    <span class="text-sm font-medium text-slate-900 sm:text-base">Lista de pacientes</span>
                </button>
            </div>
        </section>
    </main>
</body>
</html>
